name: Bug report
description: Something in the game or tooling does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks. Search existing issues first. Security problems go through SECURITY.md, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. python3 serve.py
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Browser:
        How you served the game (serve.py / other):
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Console errors, screenshots, related files.
